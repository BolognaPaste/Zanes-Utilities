version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep the Node types on the major version CI and package.json engines target (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
